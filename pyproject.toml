[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentinsight"
version = "0.1.0"
description = "An empirical software engineering tool for modeling intent-impact divergence in pull requests."
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.0,<2.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]