[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentinsight"
version = "0.1.0"
description = "An empirical software-engineering tool for modelling intent-impact divergence in pull requests."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sentence-transformers>=5.0,<6.0",
    "streamlit>=1.45,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]
research = [
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.13,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that communicate with external services",
]

[tool.setuptools.packages.find]
where = ["src"]

